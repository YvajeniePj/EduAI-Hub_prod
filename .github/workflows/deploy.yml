name: Build & Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: ./services/api-gateway
          - name: streaming-service
            context: ./services/streaming-service
          - name: subject-service
            context: ./services/subject-service
          - name: test-service
            context: ./services/test-service
          - name: submission-service
            context: ./services/submission-service
          - name: material-service
            context: ./services/material-service
          - name: video-service
            context: ./services/video-service
          - name: peer-review-service
            context: ./services/peer-review-service
          - name: gamification-service
            context: ./services/gamification-service
          - name: ai-service
            context: ./services/ai-service
          - name: analytics-service
            context: ./services/analytics-service
          - name: notification-service
            context: ./services/notification-service
          - name: feedback-service
            context: ./services/feedback-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eduai-${{ matrix.service.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eduai-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy:
    name: Trigger Portainer Redeploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger stack redeploy via Portainer webhook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
        shell: bash
