version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eduai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduai}
      POSTGRES_USER: ${POSTGRES_USER:-eduai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduai_password}
    # Ports are NOT exposed to host/internet, only accessible within Docker network
    # For local debugging via DBeaver, you could uncomment:
    # ports:
    #   - "10.10.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eduai-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduai}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: eduai-redis
    # ports:
    #   - "10.10.0.1:6399:6379"
    volumes:
      - redis_data:/data
    networks:
      - eduai-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    image: yvajeniepj12/eduai-api-gateway:latest
    container_name: eduai-api-gateway
    ports:
      - "10.10.0.1:8100:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - REDIS_URL=redis://redis:6379
      - KEYCLOAK_URL=https://keycloak.aitalenthub.ru
      - KEYCLOAK_REALM=aith
      - JWKS_URI=https://keycloak.aitalenthub.ru/realms/aith/protocol/openid-connect/certs
      - SUBJECT_SERVICE_URL=http://subject-service:8001
      - TEST_SERVICE_URL=http://test-service:8002
      - SUBMISSION_SERVICE_URL=http://submission-service:8003
      - MATERIAL_SERVICE_URL=http://material-service:8004
      - VIDEO_SERVICE_URL=http://video-service:8005
      - PEER_REVIEW_SERVICE_URL=http://peer-review-service:8006
      - GAMIFICATION_SERVICE_URL=http://gamification-service:8007
      - AI_SERVICE_URL=http://ai-service:8008
      - ANALYTICS_SERVICE_URL=http://analytics-service:8009
      - STREAMING_SERVICE_URL=http://streaming-service:8012
      - NOTIFICATION_SERVICE_URL=http://notification-service:8010
      - FEEDBACK_SERVICE_URL=http://feedback-service:8011
      - LIVEKIT_URL=http://livekit:7881
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=this-is-a-very-long-and-secure-secret-for-livekit
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - eduai-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # LiveKit Server
  livekit:
    image: yvajeniepj12/eduai-livekit:latest
    container_name: eduai-livekit
    ports:
      - "7881:7881"
      - "7882:7882"
      - "50000-50100:50000-50100/udp"
    networks:
      - eduai-network

  # Streaming Service
  streaming-service:
    image: yvajeniepj12/eduai-streaming-service:latest
    container_name: eduai-streaming-service
    ports:
      - "8012:8012"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - LIVEKIT_URL=http://livekit:7881
      - LIVEKIT_EXTERNAL_URL=https://livekit.eduaihub.aitalenthub.ru
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=this-is-a-very-long-and-secure-secret-for-livekit
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8012

  # Subject Service
  subject-service:
    image: yvajeniepj12/eduai-subject-service:latest
    container_name: eduai-subject-service
    # ports:
    #   - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  # Test Service
  test-service:
    image: yvajeniepj12/eduai-test-service:latest
    container_name: eduai-test-service
    # ports:
    #   - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - STORAGE_PATH=/app/storage
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    volumes:
      - test_storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002

  # Submission Service
  submission-service:
    image: yvajeniepj12/eduai-submission-service:latest
    container_name: eduai-submission-service
    # ports:
    #   - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - REDIS_URL=redis://redis:6379
      - TEST_SERVICE_URL=http://test-service:8002
      - AI_SERVICE_URL=http://ai-service:8008
      - GAMIFICATION_SERVICE_URL=http://gamification-service:8007
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eduai-network
    volumes:
      - static_storage:/app/static
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003

  # Material Service
  material-service:
    image: yvajeniepj12/eduai-material-service:latest
    container_name: eduai-material-service
    # ports:
    #   - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - STORAGE_PATH=/app/storage
      - AI_SERVICE_URL=http://ai-service:8008
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    volumes:
      - material_storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004

  # Video Service
  video-service:
    image: yvajeniepj12/eduai-video-service:latest
    container_name: eduai-video-service
    # ports:
    #   - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005

  # Peer Review Service
  peer-review-service:
    image: yvajeniepj12/eduai-peer-review-service:latest
    container_name: eduai-peer-review-service
    # ports:
    #   - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - SUBMISSION_SERVICE_URL=http://submission-service:8003
      - GAMIFICATION_SERVICE_URL=http://gamification-service:8007
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006

  # Gamification Service
  gamification-service:
    image: yvajeniepj12/eduai-gamification-service:latest
    container_name: eduai-gamification-service
    # ports:
    #   - "8007:8007"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007

  # AI Service (Autonomous AI Agent with Ollama)
  ai-service:
    image: yvajeniepj12/eduai-ai-service:latest
    container_name: eduai-ai-service
    # ports:
    #   - "8008:8008"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:12b}
      - REDIS_URL=redis://redis:6379
      - SUBJECT_SERVICE_URL=http://subject-service:8001
      - TEST_SERVICE_URL=http://test-service:8002
      - SUBMISSION_SERVICE_URL=http://submission-service:8003
      - MATERIAL_SERVICE_URL=http://material-service:8004
      - VIDEO_SERVICE_URL=http://video-service:8005
      - GAMIFICATION_SERVICE_URL=http://gamification-service:8007
      - NOTIFICATION_SERVICE_URL=http://notification-service:8010
      - FEEDBACK_SERVICE_URL=http://feedback-service:8011
      - PYTHONUNBUFFERED=1
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8008

  # Analytics Service
  analytics-service:
    image: yvajeniepj12/eduai-analytics-service:latest
    container_name: eduai-analytics-service
    # ports:
    #   - "8009:8009"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8009

  # Notification Service
  notification-service:
    image: yvajeniepj12/eduai-notification-service:latest
    container_name: eduai-notification-service
    # ports:
    #   - "8010:8010"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - SUBMISSION_SERVICE_URL=http://submission-service:8003
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010

  # Feedback Service
  feedback-service:
    image: yvajeniepj12/eduai-feedback-service:latest
    container_name: eduai-feedback-service
    # ports:
    #   - "8011:8011"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eduai}:${POSTGRES_PASSWORD:-eduai_password}@postgres:5432/${POSTGRES_DB:-eduai}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduai-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011

  # Frontend (Angular)
  frontend:
    image: yvajeniepj12/eduai-frontend:latest
    container_name: eduai-frontend
    environment:
      - API_URL=http://api-gateway:8000
    depends_on:
      - api-gateway
    networks:
      - eduai-network
    ports:
      - "10.10.0.1:3100:80"



volumes:
  postgres_data:
    name: eduai-postgres-data
  redis_data:
    name: eduai-redis-data
  material_storage:
    name: eduai-material-data
  test_storage:
    name: eduai-test-data
  static_storage:
    name: eduai-static-data


networks:
  eduai-network:
    name: eduai-network
    driver: bridge
